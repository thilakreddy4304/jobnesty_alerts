name: Check Jobnesty

on:
  # Target: 7:00-8:30 AM Eastern, Monday-Friday. An external scheduler (cron-job.org) POSTs a
  # "watch" dispatch at 7:00 ET, and check.py --watch reloads the dashboard every 2 minutes
  # until the first alert or 8:30. GitHub's own cron isn't used: on this repo it ran 5-8 hours
  # late (13:18, 12:56 and 15:37 ET), so the gate skipped every start.
  repository_dispatch:
    types: [watch]
  workflow_dispatch: # manual runs skip the gate, so you can test any time
    inputs:
      mock_alert:
        description: "Send a test push from the fake jobs in tests/fixture_dashboard.html (real seen.json untouched)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: jobnesty-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    environment: jobnest  # the secrets live in this environment
    timeout-minutes: 105  # the watch loop ends by 8:30 ET, at most ~90 minutes after a 7:00 start
    steps:
      - uses: actions/checkout@v5

      - name: Gate (Eastern time window, already alerted today)
        id: gate
        run: |
          now=$((10#$(TZ=America/New_York date +%H%M)))
          today=$(TZ=America/New_York date +%F)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Manual run: skipping the gate"
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$now" -lt 700 ] || [ "$now" -ge 830 ]; then
            echo "Outside 7:00-8:30 Eastern (now $now), skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          elif [ "$(cat last_alert.txt 2>/dev/null)" = "$today" ]; then
            echo "Already alerted today ($today), skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Mock alert (fake jobs, throwaway seen.json)
        if: inputs.mock_alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          cd "$(mktemp -d)"
          echo '[]' > seen.json
          python "$GITHUB_WORKSPACE/check.py" --fixture "$GITHUB_WORKSPACE/tests/fixture_dashboard.html"

      - name: Check for new jobs
        if: steps.gate.outputs.run == 'true' && !inputs.mock_alert
        env:
          JN_EMAIL: ${{ secrets.JN_EMAIL }}
          JN_PASSWORD: ${{ secrets.JN_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        # Scheduled runs watch until the first alert or 8:30 ET; manual runs check once.
        run: python check.py ${{ github.event_name != 'workflow_dispatch' && '--watch' || '' }}

      - name: Commit seen.json if it changed
        if: steps.gate.outputs.run == 'true' && !inputs.mock_alert
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          [ -f last_alert.txt ] && git add last_alert.txt
          if git diff --cached --quiet; then
            echo "seen.json unchanged"
          else
            git commit -m "Update seen.json"
            git push
          fi
